<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車両情報｜AIKOUCAR</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
/* ============================================================
   車両データ（1台ごとにこのブロックだけ書き換える）
   - このフォルダ（car/sample/）を車ごとにコピーし、フォルダ名を
     車の識別名にする（例：car/rx7-fd/）。URLがQRの読み取り先になる。
   - 空欄（""）の項目は自動で非表示になる。
   ============================================================ */
window.CAR = {
  status: "レンタル・販売",              // 例：「レンタル」「販売」「レンタル・販売」「展示のみ」
  maker: "（メーカー）",
  model: "（車名）",
  grade: "（型式・グレード）",           // 例：FD3S Type RS
  year: "（年式）",                      // 例：1999年
  mileage: "（走行距離）",               // 例：8.2万km
  color: "（色）",
  mission: "（MT/AT）",
  photo: "",                            // 例："photo1.jpg"（このフォルダに置いた画像名）。空なら仮画像
  rental: {                             // レンタル料金（空欄なら非表示）
    hour: "（1時間の料金）",             // 例：5,500円
    day: "（1日の料金）",
    note: "AIKOUCAR 有料会員は会員価格でご利用いただけます。"
  },
  sale: {
    price: "（販売価格）",               // 例：480万円（税込・諸費用別）
    note: "ローンのご相談も承ります。"
  },
  owner: {
    name: "（オーナー名）",
    story: "（この車への思いを2〜4文で。どこが好きか、どう乗ってほしいか。）"
  },
  points: ["（見どころ1）", "（見どころ2）", "（見どころ3）"],
  line: "https://line.me/ti/g/ad9U6nLKP9",
  hp: "https://aikoucar.netlify.app/"
};
</script>
<style>
:root{--void:#050505;--carbon:#141414;--edge:#2E2E2E;--nos:#FFA23A;--tail:#FF6A00;--chrome:#ECECEC;--mute:#C2C2C2;--dim:#9A9A9A;
  --anton:"Anton",Impact,sans-serif;--arch:"Archivo",system-ui,sans-serif;--jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--chrome);font-family:var(--jp);font-size:15px;line-height:1.85}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
.photo{aspect-ratio:4/3;background:linear-gradient(135deg,#1c1c1c,#0b0b0b);display:grid;place-items:center;overflow:hidden;border-bottom:3px solid var(--tail)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{font-family:var(--arch);letter-spacing:.3em;color:var(--dim);font-size:13px}
.head{padding:22px 0 8px}
.badge{display:inline-block;font-weight:700;font-size:12px;color:#0A0A0A;background:var(--tail);padding:2px 10px;margin-bottom:10px}
.maker{font-family:var(--arch);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--nos);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(26px,7.5vw,36px);line-height:1.3}
.grade{color:var(--mute);font-size:14px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.specs div{background:var(--carbon);border:1px solid var(--edge);padding:10px 6px;text-align:center}
.specs span{display:block;font-size:12px;color:var(--dim)}
.specs b{font-size:14px}
section{padding:22px 0;border-top:1px solid var(--edge)}
.kick{font-family:var(--arch);font-weight:700;font-size:12px;letter-spacing:.3em;color:var(--nos);margin-bottom:8px}
.price{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.price div{background:var(--carbon);border:1px solid var(--edge);padding:14px}
.price span{display:block;font-size:13px;color:var(--mute)}
.price b{font-family:var(--jp);font-weight:900;font-size:22px;color:var(--nos)}
.big{background:var(--carbon);border:1px solid #7A3200;padding:16px}
.big b{display:block;font-weight:900;font-size:26px;color:var(--nos)}
.note{font-size:13px;color:var(--dim);margin-top:8px}
.story{border-left:3px solid var(--tail);padding-left:14px}
.story p{color:var(--chrome)}
.story .who{font-size:13px;color:var(--mute);margin-top:8px}
ul.pts{list-style:none}
ul.pts li{position:relative;padding-left:18px;margin-bottom:6px}
ul.pts li::before{content:"";position:absolute;left:2px;top:.75em;width:7px;height:7px;background:var(--tail)}
.cta{display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:10px;background:#06C755;color:#fff;font-weight:900;font-size:16px;text-decoration:none}
.cta2{display:flex;align-items:center;justify-content:center;min-height:50px;margin-top:10px;border:1px solid var(--nos);color:var(--nos);font-weight:700;text-decoration:none}
.cta:focus-visible,.cta2:focus-visible{outline:3px solid var(--nos);outline-offset:2px}
footer{text-align:center;color:var(--dim);font-size:12px;padding:28px 0 40px}
[hidden]{display:none!important}
@media (max-width:360px){.specs{grid-template-columns:1fr 1fr}.price{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="photo" id="photo"><span class="ph">PHOTO</span></div>
<main class="wrap">
  <div class="head">
    <span class="badge" id="status"></span>
    <p class="maker" id="maker"></p>
    <h1 id="model"></h1>
    <p class="grade" id="grade"></p>
    <div class="specs">
      <div data-k="year"><span>年式</span><b></b></div>
      <div data-k="mileage"><span>走行</span><b></b></div>
      <div data-k="color"><span>色</span><b></b></div>
      <div data-k="mission"><span>ミッション</span><b></b></div>
    </div>
  </div>

  <section id="rentalSec">
    <p class="kick">RENTAL</p>
    <div class="price">
      <div id="rHour"><span>1時間</span><b></b></div>
      <div id="rDay"><span>1日</span><b></b></div>
    </div>
    <p class="note" id="rNote"></p>
  </section>

  <section id="saleSec">
    <p class="kick">FOR SALE</p>
    <div class="big"><span class="note" style="margin:0">販売価格</span><b id="sPrice"></b></div>
    <p class="note" id="sNote"></p>
  </section>

  <section id="ownerSec">
    <p class="kick">OWNER'S STORY</p>
    <div class="story"><p id="story"></p><p class="who" id="owner"></p></div>
  </section>

  <section id="ptsSec">
    <p class="kick">POINTS</p>
    <ul class="pts" id="pts"></ul>
  </section>

  <section>
    <p class="kick">CONTACT</p>
    <p>レンタル・購入のご相談、試乗のご希望は LINE でどうぞ。</p>
    <a class="cta" id="line" href="#" target="_blank" rel="noopener">LINE で問い合わせる</a>
    <a class="cta2" id="hp" href="#">AIKOUCAR について</a>
  </section>
</main>
<footer>AIKOUCAR｜X-LINK株式会社</footer>
<script>
(function(){
  var c = window.CAR, $ = function(i){ return document.getElementById(i); };
  var has = function(v){ return v && String(v).trim() !== ''; };
  function set(id, v){ var el = $(id); if (has(v)) el.textContent = v; else el.hidden = true; }
  document.title = (c.model || '車両情報') + '｜AIKOUCAR';
  set('status', c.status); set('maker', c.maker); set('model', c.model); set('grade', c.grade);
  document.querySelectorAll('.specs [data-k]').forEach(function(d){ var v = c[d.dataset.k]; if (has(v)) d.querySelector('b').textContent = v; else d.hidden = true; });
  if (has(c.photo)){ var img = new Image(); img.src = c.photo; img.alt = (c.maker||'') + ' ' + (c.model||''); $('photo').innerHTML = ''; $('photo').appendChild(img); }
  var r = c.rental || {};
  if (has(r.hour) || has(r.day)){ if (has(r.hour)) $('rHour').querySelector('b').textContent = r.hour; else $('rHour').hidden = true;
    if (has(r.day)) $('rDay').querySelector('b').textContent = r.day; else $('rDay').hidden = true; set('rNote', r.note); } else $('rentalSec').hidden = true;
  var s = c.sale || {};
  if (has(s.price)){ $('sPrice').textContent = s.price; set('sNote', s.note); } else $('saleSec').hidden = true;
  var o = c.owner || {};
  if (has(o.story)){ $('story').textContent = o.story; set('owner', has(o.name) ? 'オーナー　' + o.name : ''); } else $('ownerSec').hidden = true;
  var pts = (c.points || []).filter(has);
  if (pts.length){ pts.forEach(function(t){ var li = document.createElement('li'); li.textContent = t; $('pts').appendChild(li); }); } else $('ptsSec').hidden = true;
  $('line').href = c.line; $('hp').href = c.hp;
})();
</script>
</body>
</html>
