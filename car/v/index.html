<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>この車のプロフィール｜AIKOUCAR</title>
<meta name="robots" content="noindex">
<meta name="description" content="AIKOUCAR メンバーの愛車プロフィール。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@1,700;1,900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--carbon:#161616;--edge:#2E2E2E;--nos:#FFA23A;--tail:#FF6A00;--tail-d:#7A3200;--chrome:#ECECEC;--mute:#C2C2C2;--dim:#9A9A9A;
  --anton:"Anton",Impact,"Arial Black",sans-serif;--arch:"Archivo",system-ui,sans-serif;--jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--chrome);font-family:var(--jp);font-size:16px;line-height:1.85;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header{border-top:4px solid var(--tail);padding:8px 0;border-bottom:1px solid var(--edge)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;min-height:44px;font-family:var(--arch);font-style:italic;font-weight:900;font-size:17px;letter-spacing:.2em;color:var(--nos);text-decoration:none}
header span{font-size:12px;color:var(--dim);letter-spacing:.08em}
.hero{padding:44px 0 34px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px);border-bottom:1px solid var(--edge)}
.kick{font-family:var(--arch);font-style:italic;font-weight:700;font-size:12px;letter-spacing:.32em;color:var(--nos)}
.maker{margin-top:22px;font-family:var(--arch);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.24em;color:var(--nos);text-transform:uppercase;line-height:1.3}
h1{font-family:var(--anton),var(--jp);font-weight:900;font-size:clamp(40px,13vw,68px);line-height:1.08;letter-spacing:.01em;color:#fff;margin-top:4px;overflow-wrap:anywhere;text-shadow:0 0 44px rgba(255,106,0,.28)}
.grade{margin-top:14px;font-size:17px;font-weight:700;color:#e6e6e6;line-height:1.5}
.grade b{display:inline-block;background:var(--tail);color:#0a0a0a;font-family:var(--anton);font-weight:400;font-size:17px;padding:0 10px;margin-right:10px;letter-spacing:.04em}
section{padding:30px 0;border-bottom:1px solid var(--edge)}
.pts{list-style:none;display:grid;gap:12px;margin-top:14px}
.pts li{position:relative;padding:14px 16px 14px 44px;background:var(--carbon);border:1px solid var(--edge);font-weight:700;font-size:16px;line-height:1.6;color:#fff}
.pts li::before{content:"";position:absolute;left:16px;top:22px;width:13px;height:13px;background:var(--tail);transform:skewX(-12deg)}
.word{margin-top:14px;border-left:3px solid var(--tail);padding:4px 0 4px 16px;font-size:18px;font-weight:500;line-height:1.8;color:#fff}
.owner{margin-top:14px;font-family:var(--arch);font-style:italic;font-weight:700;font-size:12px;letter-spacing:.24em;color:var(--nos)}
.owner b{font-family:var(--jp);font-style:normal;font-weight:900;font-size:17px;letter-spacing:.04em;color:#fff;margin-left:10px}
.join{padding:36px 0 30px;border-bottom:0}
.join h2{font-weight:900;font-size:clamp(24px,7vw,30px);line-height:1.4;color:#fff}
.join p{margin-top:10px;color:var(--chrome);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;margin-top:18px;padding:10px 16px;background:var(--tail);color:#0a0a0a;font-weight:900;font-size:17px;letter-spacing:.06em;text-decoration:none}
.btn.line{background:#06C755;color:#04220f}
.btn.ghost{background:transparent;color:var(--nos);border:1px solid var(--nos);min-height:52px;font-size:15px;margin-top:12px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
footer{text-align:center;color:var(--dim);font-size:12px;padding:10px 0 44px}
[hidden]{display:none!important}
.up{animation:up .7s ease both}
.up:nth-of-type(2){animation-delay:.08s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.up{animation:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="https://aikoucar.netlify.app/">AIKOUCAR</a><span>車好きのコミュニティ</span></div></header>
<main>
  <div class="hero" id="car">
    <div class="wrap">
      <p class="kick">MEMBER'S CAR</p>
      <p class="maker up" id="maker"></p>
      <h1 class="up" id="model"></h1>
      <p class="grade" id="grade"></p>
    </div>
  </div>
  <div class="wrap">
    <section id="ptsSec">
      <p class="kick">POINTS</p>
      <ul class="pts" id="pts"></ul>
    </section>
    <section id="ownerSec">
      <p class="kick">FROM THE OWNER</p>
      <p class="word" id="word"></p>
      <p class="owner" id="ownerLine">OWNER<b id="owner"></b></p>
    </section>
    <section id="miss" hidden>
      <p class="kick">SORRY</p>
      <p class="word" style="border:0;padding:0;font-size:16px">車の情報を読み取れませんでした。QRコードをもう一度読み取ってみてください。</p>
    </section>
    <section class="join">
      <h2 id="joinH">この車のオーナーも、<br>AIKOUCAR にいます。</h2>
      <p>車が好きな人が集まるコミュニティです。入会は無料。見ているだけでも大丈夫です。</p>
      <a class="btn line" href="https://line.me/ti/g/ad9U6nLKP9" rel="noopener">LINE で参加する（無料）</a>
      <a class="btn ghost" href="https://aikoucar.netlify.app/">AIKOUCAR がどんな場所か見る</a>
    </section>
  </div>
</main>
<footer>AIKOUCAR｜X-LINK株式会社</footer>
<script>
/* 車の情報は URL の # 以降に入っている（サーバーには送られない）。表示は必ず textContent で行う。 */
(function(){
  var $=function(i){return document.getElementById(i)};
  function dec(h){
    try{
      var m=/^#?([ab])([A-Za-z0-9_-]+)$/.exec(h||''); if(!m) return null;
      var b=atob(m[2].replace(/-/g,'+').replace(/_/g,'/')), u=new Uint8Array(b.length);
      for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
      var t=new TextDecoder(m[1]==='a' ? 'utf-8' : 'utf-16le').decode(u), a=t.split('\n').slice(0,9);
      while(a.length<9) a.push('');
      return a.map(function(x){ return x.slice(0,60); });
    }catch(e){ return null; }
  }
  function show(){
    var a=dec(location.hash), ok=a && (a[0]||a[1]);
    $('car').hidden=!ok; $('miss').hidden=!!ok;
    if(!ok){ $('ptsSec').hidden=true; $('ownerSec').hidden=true; $('joinH').textContent='AIKOUCAR へようこそ。'; return; }
    $('maker').textContent=a[0]; $('maker').hidden=!a[0];
    $('model').textContent=a[1]||a[0];
    var g=$('grade'); g.textContent='';
    if(a[3]){ var b=document.createElement('b'); b.textContent=a[3]; g.appendChild(b); }
    g.appendChild(document.createTextNode(a[2]||'')); g.hidden=!(a[2]||a[3]);
    var ul=$('pts'); ul.textContent='';
    [a[4],a[5],a[6]].filter(Boolean).forEach(function(t){ var li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
    $('ptsSec').hidden=!ul.children.length;
    $('word').textContent=a[8] ? '「'+a[8].replace(/^[「『]|[」』]$/g,'')+'」' : ''; $('word').hidden=!a[8];
    $('owner').textContent=a[7]; $('ownerLine').hidden=!a[7];
    $('ownerSec').hidden=!(a[7]||a[8]);
    document.title=(a[1]||a[0])+'｜AIKOUCAR';
    fit();
  }
  // 車名は、まず1行に収まる大きさを探す。小さくなりすぎるなら2行にする
  function fit(){
    var el=$('model'); el.style.whiteSpace='nowrap'; el.style.fontSize='';
    var size=parseFloat(getComputedStyle(el).fontSize), min=Math.max(30, size*0.62);
    while(size>min && el.scrollWidth>el.clientWidth+1){ size-=2; el.style.fontSize=size+'px'; }
    if(el.scrollWidth>el.clientWidth+1){ el.style.whiteSpace='normal'; el.style.fontSize=Math.round(min*1.15)+'px'; }
  }
  addEventListener('hashchange',show); addEventListener('resize',function(){ if(!$('car').hidden) fit(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!$('car').hidden) fit(); });
  show();
})();
</script>
</body>
</html>
